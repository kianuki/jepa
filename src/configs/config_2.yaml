defaults:
  - model: jepa_2
  - writer: wandb
  - metrics: jepa
  - datasets: cifar10
  - dataloader: dataloader_2
  - loss_function: jepa
  - transforms: cifar_transform
optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 5e-3
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  total_steps: 78100 #ОПАСНО 
  pct_start: 0.25
  max_lr: 5e-5
  div_factor: 500.0
  final_div_factor: 50.0 
trainer:
  log_step: 781
  n_epochs: 100
  n_epoch_probe: 5
  epoch_len: 781
  device_tensors: ["image", "fine_label"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: "auto" # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "max test_MulticlassAccuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1

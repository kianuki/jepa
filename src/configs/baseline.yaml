defaults:
  - model: dbg_ijepa
  - writer: wandb
  - metrics: dbg_metric
  - datasets: cifar10
  - dataloader: example
  - loss_function: jepa
  - transforms: cifar_transform
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  pct_start: 0.20
  max_lr: 5e-5
  div_factor: 500.0
  final_div_factor: 50.0 
visualization:
  _target_: src.metrics.AttentionVisualizer
  enabled: True
  split: test
  num_images: 5
  seed: 42
  log_every_n_epochs: 1
  encoder_layers: null
  predictor_layers: null
  alpha: 0.55
  image_name_prefix: attn
trainer:
  log_step: null
  n_epochs: 2
  n_epoch_probe: 2
  epoch_len: null
  device_tensors: ["image", "fine_label"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "off" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1

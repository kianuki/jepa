defaults:
  - model: jepa_ut
  - writer: wandb_ut
  - metrics: jepa
  - datasets: cifar10
  - dataloader: dataloader_1
  - loss_function: jepa
  - transforms: example
optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-3
  weight_decay: 3e-4
#lr_scheduler:
#  _target_: torch.optim.lr_scheduler.StepLR
#  gamma: 0.9
#  step_size: ${trainer.epoch_len}
lr_scheduler:
  _target_: timm.scheduler.cosine_lr.CosineLRScheduler
  t_initial: 103800 #ОПАСНО 
  lr_min: 1e-6
  warmup_t: ${trainer.epoch_len}
  warmup_lr_init: 1e-7
  cycle_decay: 1
trainer:
  log_step: 1038
  n_epochs: 100
  n_epoch_probe: 5
  epoch_len: 1038
  device_tensors: ["image", "fine_label"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: "auto" # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "max test_MulticlassAccuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
